# Render Blueprint — AI Car Wash
# Deploy everything with one click:
#   Render Dashboard → New → Blueprint → connect this repo
#
# After first deploy, fill in the secret env vars in the Render dashboard
# (they are marked sync: false below so Render will prompt you).

services:
  # ── Spring Boot Backend ───────────────────────────────────────────────────
  - type: web
    name: car-wash-backend
    runtime: docker
    dockerfilePath: ./car-wash-backend/Dockerfile
    dockerContext: ./car-wash-backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # Injected by Render from the managed DB/Redis below
      - key: DB_HOST
        fromDatabase:
          name: car-wash-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: car-wash-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: car-wash-db
          property: database
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: car-wash-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: car-wash-db
          property: password
      - key: SPRING_DATA_REDIS_HOST
        fromService:
          name: car-wash-redis
          type: redis
          property: host
      - key: SPRING_DATA_REDIS_PORT
        fromService:
          name: car-wash-redis
          type: redis
          property: port

      # ── Secrets — fill these in Render dashboard after first deploy ──────
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRATION
        value: "7200000"
      - key: GEMINI_API_KEY
        sync: false
      - key: TOYYIBPAY_SECRET_KEY
        sync: false
      - key: TOYYIBPAY_CATEGORY_CODE
        sync: false
      - key: TOYYIBPAY_BASE_URL
        value: https://dev.toyyibpay.com
      - key: TOYYIBPAY_RETURN_URL
        sync: false
      - key: TOYYIBPAY_CALLBACK_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: JPA_SHOW_SQL
        value: "false"

      # ── SMTP (password-reset emails) — optional, app boots fine without ──
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        value: noreply@azurewash.my

  # ── Redis 7 ───────────────────────────────────────────────────────────────  ← MOVED HERE
  - type: redis
    name: car-wash-redis
    plan: free
    ipAllowList: []

# ── PostgreSQL 15 ─────────────────────────────────────────────────────────
databases:
  - name: car-wash-db
    databaseName: carwashdb
    plan: free
    postgresMajorVersion: "15"
