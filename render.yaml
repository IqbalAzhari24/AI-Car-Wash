# Render Blueprint — AI Car Wash
# Deploy everything with one click:
#   Render Dashboard → New → Blueprint → connect this repo
#
# After first deploy, fill in the secret env vars in the Render dashboard
# (they are marked sync: false below so Render will prompt you).

services:
  # ── Spring Boot Backend ───────────────────────────────────────────────────
  - type: web
    name: car-wash-backend
    runtime: docker
    dockerfilePath: ./car-wash-backend/Dockerfile
    dockerContext: ./car-wash-backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      # Injected by Render from the managed DB/Redis below
      - key: SPRING_DATASOURCE_URL
        fromDatabase:
          name: car-wash-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: car-wash-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: car-wash-db
          property: password
      - key: SPRING_DATA_REDIS_HOST
        fromService:
          name: car-wash-redis
          type: redis
          property: host
      - key: SPRING_DATA_REDIS_PORT
        fromService:
          name: car-wash-redis
          type: redis
          property: port

      # ── Secrets — fill these in Render dashboard after first deploy ──────
      - key: JWT_SECRET
        sync: false           # Render will prompt you to enter this
      - key: JWT_EXPIRATION
        value: "7200000"
      - key: GEMINI_API_KEY
        sync: false
      - key: TOYYIBPAY_SECRET_KEY
        sync: false
      - key: TOYYIBPAY_CATEGORY_CODE
        sync: false
      - key: TOYYIBPAY_BASE_URL
        value: https://dev.toyyibpay.com

      # ── Update these after you know your deployed URLs ───────────────────
      # TOYYIBPAY_RETURN_URL  = https://<your-frontend>.pages.dev/checkout/return
      # TOYYIBPAY_CALLBACK_URL = https://<your-backend>.onrender.com/api/v1/payments/toyyibpay/callback
      # CORS_ALLOWED_ORIGINS   = https://<your-frontend>.pages.dev
      - key: TOYYIBPAY_RETURN_URL
        sync: false
      - key: TOYYIBPAY_CALLBACK_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      - key: JPA_SHOW_SQL
        value: "false"

  # ── PostgreSQL 15 ─────────────────────────────────────────────────────────
databases:
  - name: car-wash-db
    databaseName: carwashdb
    plan: free
    postgresMajorVersion: 15

  # ── Redis 7 ───────────────────────────────────────────────────────────────
  - name: car-wash-redis
    plan: free
    ipAllowList: []           # Only accessible from within Render private network
