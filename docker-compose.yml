version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: car-wash-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: carwashdb
      POSTGRES_USER: carwashuser
      POSTGRES_PASSWORD: carwashpassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carwashuser -d carwashdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: car-wash-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  spring-backend:
    build:
      context: ./car-wash-backend
      dockerfile: Dockerfile
    container_name: car-wash-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/carwashdb
      SPRING_DATASOURCE_USERNAME: carwashuser
      SPRING_DATASOURCE_PASSWORD: carwashpassword
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-GEMINI_API_KEY_NOT_SET}
      TOYYIBPAY_SECRET_KEY: ${TOYYIBPAY_SECRET_KEY:-}
      TOYYIBPAY_CATEGORY_CODE: ${TOYYIBPAY_CATEGORY_CODE:-}
      TOYYIBPAY_BASE_URL: ${TOYYIBPAY_BASE_URL:-https://dev.toyyibpay.com}
      TOYYIBPAY_RETURN_URL: ${TOYYIBPAY_RETURN_URL:-http://localhost:5173/checkout/return}
      TOYYIBPAY_CALLBACK_URL: ${TOYYIBPAY_CALLBACK_URL:-http://localhost:8080/api/v1/payments/toyyibpay/callback}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  react-frontend:
    build:
      context: ./car-wash-frontend
      dockerfile: Dockerfile
    container_name: car-wash-frontend
    ports:
      - "5173:5173"
    depends_on:
      - spring-backend
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
