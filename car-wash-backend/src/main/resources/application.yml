spring:
  application:
    name: car-wash-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/carwashdb}
    username: ${SPRING_DATASOURCE_USERNAME:carwashuser}
    password: ${SPRING_DATASOURCE_PASSWORD:carwashpassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

# JWT_SECRET must be a base64-encoded value of at least 256 bits (32 bytes).
# Generate one with: openssl rand -base64 48
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:7200000}

# toyyibPay gateway (sandbox by default). Online checkout is enabled only when
# secret-key and category-code are set; otherwise cash checkout still works.
toyyibpay:
  base-url: ${TOYYIBPAY_BASE_URL:https://dev.toyyibpay.com}
  secret-key: ${TOYYIBPAY_SECRET_KEY:}
  category-code: ${TOYYIBPAY_CATEGORY_CODE:}
  return-url: ${TOYYIBPAY_RETURN_URL:http://localhost:5173/checkout/return}
  callback-url: ${TOYYIBPAY_CALLBACK_URL:http://localhost:8080/api/v1/payments/toyyibpay/callback}

# Google Gemini key for Timah AI (placeholder until provided).
gemini:
  api:
    key: ${GEMINI_API_KEY:GEMINI_API_KEY_NOT_SET}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

server:
  port: 8080
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: always
    include-binding-errors: never
