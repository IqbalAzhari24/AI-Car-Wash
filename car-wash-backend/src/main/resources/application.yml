spring:
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:file:.env[.properties]

  application:
    name: car-wash-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${DB_PORT:5433}/${DB_NAME:carwashdb}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USER:carwashuser}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:carwashpassword}}
    driver-class-name: org.postgresql.Driver
    hikari:
      max-lifetime: 1800000       # 30 min — evict connections before PG closes them
      keepalive-time: 60000       # send keepalive every 60s to prevent server-side close
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}

  # SMTP. JavaMailSender bean is created ONLY when MAIL_HOST is set; leave it
  # empty and the app still boots (password-reset emails are skipped).
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# JWT_SECRET must be a base64-encoded value of at least 256 bits (32 bytes).
# Generate one with: openssl rand -base64 48
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:7200000}

# toyyibPay gateway (sandbox by default). Online checkout is enabled only when
# secret-key and category-code are set; otherwise cash checkout still works.
toyyibpay:
  base-url: ${TOYYIBPAY_BASE_URL:https://dev.toyyibpay.com}
  secret-key: ${TOYYIBPAY_SECRET_KEY:}
  category-code: ${TOYYIBPAY_CATEGORY_CODE:}
  return-url: ${TOYYIBPAY_RETURN_URL:http://localhost:5173/checkout/return}
  callback-url: ${TOYYIBPAY_CALLBACK_URL:http://localhost:8080/api/v1/payments/toyyibpay/callback}

# Google Gemini key for Timah AI (placeholder until provided).
gemini:
  api:
    key: ${GEMINI_API_KEY:GEMINI_API_KEY_NOT_SET}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

azurewash:
  mail:
    from: ${MAIL_FROM:noreply@aicarwash.my}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # Don't let SMTP reachability affect app health — a mail outage must not
    # flap the container's healthcheck.
    mail:
      enabled: false

server:
  port: 8080
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: always
    include-binding-errors: never
