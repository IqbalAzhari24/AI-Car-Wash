name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Integration tests self-provision Postgres/Redis via Testcontainers;
      # ubuntu-latest has Docker preinstalled, so no service containers needed.
      - name: Run tests
        working-directory: car-wash-backend
        run: mvn test --no-transfer-progress
